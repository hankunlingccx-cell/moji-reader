<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>墨迹 · 标注库</title><link rel="stylesheet" href="library.css"><link rel="stylesheet" href="theme-ios.css"></head>
<body>
  <aside>
    <div class="brand"><span class="brand-mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7"/><path d="m17 3 4 4-10 10-4 1 1-4zM15 5l4 4"/></svg></span><div><b>墨迹</b></div></div>

    <nav>
      <button id="nav-all" class="selected"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span class="nav-label">所有标注</span><span id="count" class="nav-count">0</span></button>
      <button id="nav-drafts"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m16 3 5 5-11 11-6 1 1-6zM14 5l5 5"/></svg><span class="nav-label">笔记草稿</span><span id="draft-count" class="nav-count">0</span></button>
      <button id="nav-trash"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg><span class="nav-label">回收站</span><span id="trash-count" class="nav-count">0</span></button>
    </nav>
    <div class="aside-bottom"><a href="guide.html" target="_blank" rel="noopener">使用说明 ↗</a><span data-info="数据保存在当前浏览器。卸载扩展、删除配置或重装可能丢失数据；请先导出备份。" aria-label="数据保存说明"></span></div>
  </aside>
  <main>
    <header><div><h1 id="heading">标注库</h1></div><div class="backup-tools"><button id="export-ai" class="primary">导出给 AI</button><button id="export" class="secondary">导出完整备份</button><button id="import" class="secondary">导入备份</button><input id="import-file" type="file" accept=".json,application/json" hidden></div></header>
    <div class="backup-info"><span id="backup-state">正在读取…</span><span data-info="完整 JSON 备份包含标注、历史、回收站、草稿、配色与双语定位。文件未加密，请妥善保存。" aria-label="完整备份说明"></span></div>
    <details id="palette-settings"><summary>颜色与含义 <span data-info="自定义五种颜色和含义，保存后已有标记也会更新。" aria-label="颜色设置说明"></span></summary><div class="palette-body"><form id="palette-form"><div id="palette-rows"></div><div class="palette-actions"><button id="palette-save" type="submit" class="primary">保存颜色设置</button><button id="palette-reset" type="button" class="secondary">恢复默认配色</button><span id="palette-status" role="status" aria-live="polite"></span></div></form></div></details>
    <details id="codex-settings"><summary>Codex 自动标注 <span id="codex-summary">未连接</span><span data-info="先运行连接器安装脚本，再导入生成的 connection.json。可在网页侧栏发起任务，使用本机 Codex 的额度。" aria-label="Codex 连接说明"></span></summary><div class="codex-body"><div class="codex-controls"><button id="codex-import" class="primary">导入连接文件</button><button id="codex-reconnect" class="secondary" disabled>重新连接</button><button id="codex-disconnect" class="secondary" disabled>断开</button><input id="codex-connection-file" type="file" accept=".json,application/json" hidden><span id="codex-status" role="status">尚未配置连接</span></div><h3>自动标注批次</h3><div id="codex-batches"></div><div id="codex-operation-status" role="status"></div></div></details>
    <section class="workspace"><div class="records-pane"><div class="filters"><input id="search" type="search" placeholder="搜索网页、标注或笔记…" aria-label="搜索标注"><select id="color" aria-label="颜色筛选"><option value="all">所有颜色</option><option value="yellow">重要结论</option><option value="blue">研究方法</option><option value="green">值得借鉴</option><option value="rose">疑问待查</option><option value="purple">其他想法</option></select></div><div id="pages-heading" class="pages-heading">有标注的网页</div><div id="results" aria-label="有标注的网页列表"></div></div><section id="detail" aria-label="当前网页的标注列表"><div id="article-header" hidden></div><div id="annotations"><div class="placeholder"><h2>选择网页</h2></div></div></section></section>
    <div id="status" role="status" aria-live="polite"></div>
  </main>
  <dialog id="ai-export-dialog" aria-labelledby="ai-export-title">
    <header class="ai-dialog-header"><div><h2 id="ai-export-title">导出给 AI</h2></div><button id="ai-close" type="button" aria-label="关闭导出窗口" title="关闭">×</button></header>
    <div class="ai-export-layout">
      <section class="ai-picker" aria-label="选择导出的网页和标注"><div class="ai-picker-tools"><strong>网页与标注</strong><div><button id="ai-all" type="button" class="small-button">全选</button><button id="ai-none" type="button" class="small-button">清空</button></div></div><div id="ai-selection"></div></section>
      <section class="ai-preview-pane" aria-label="Markdown 导出预览"><div class="ai-task-label"><label for="ai-task">给 AI 的任务</label><span data-info="可填写希望 AI 完成的任务，也可留空。仅导出已勾选的标注。" aria-label="导出任务说明"></span></div><textarea id="ai-task" rows="3" maxlength="10000"></textarea><label class="ai-preview-label" for="ai-preview">Markdown 预览</label><textarea id="ai-preview" readonly spellcheck="false" aria-label="Markdown 预览"></textarea></section>
    </div>
    <footer class="ai-dialog-footer"><div><strong id="ai-summary" role="status" aria-live="polite"></strong><div id="ai-export-status" role="status"></div></div><button id="ai-download" type="button" class="primary" disabled>下载 Markdown (.md)</button></footer>
  </dialog>
  <script src="info.js"></script><script src="palette.js"></script><script src="markdown-export.js"></script><script src="ai-export.js"></script><script src="codex-ui.js"></script><script src="library.js"></script>
</body></html>
